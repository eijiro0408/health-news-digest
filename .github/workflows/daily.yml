name: 毎朝のニュース配信

on:
  schedule:
    # GitHub の定期実行は、このリポジトリでは予約より4〜8時間おそく動いたり、
    # まるごととばされたりしている（2026年11月の記録）。そこで:
    # - 前の日の夜 19:07 から朝 6:37（日本時間）まで、1時間ごとに予約を入れる
    #   （ちょうど0分・30分は混むので、7分・37分にずらす）
    # - 1:15 より後に最初に動いた回が準備して、7:00 まで待ってから送る
    # - 1:15 より前に動いた回は、7:00 まで待ちきれない（最長6時間）ので何もしない
    # - あとから動いた回は「配信済み」なので何もしない
    - cron: "7 10 * * *"   # 日本時間 19:07
    - cron: "7 11 * * *"   # 日本時間 20:07
    - cron: "7 12 * * *"   # 日本時間 21:07
    - cron: "7 13 * * *"   # 日本時間 22:07
    - cron: "7 14 * * *"   # 日本時間 23:07
    - cron: "7 15 * * *"   # 日本時間 0:07
    - cron: "7 16 * * *"   # 日本時間 1:07
    - cron: "7 17 * * *"   # 日本時間 2:07
    - cron: "7 18 * * *"   # 日本時間 3:07
    - cron: "7 19 * * *"   # 日本時間 4:07
    - cron: "7 20 * * *"   # 日本時間 5:07
    - cron: "7 21 * * *"   # 日本時間 6:07
    - cron: "37 21 * * *"   # 日本時間 6:37
  workflow_dispatch: # 手動実行ボタン（テスト用。押すとすぐ配信する）

permissions:
  contents: write

# 同時に2つ動かないよう、順番待ちにする
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub の上限（6時間）の少し手前
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # Proプランで AI を動かすための公式コマンド（claude）を入れる
      - run: npm install -g @anthropic-ai/claude-code

      - name: ニュースを集めて選ぶ
        id: digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python digest.py ${{ github.event_name == 'schedule' && '--once-per-day --not-before 01:15' || '' }}

      - name: Web ページを更新
        if: steps.digest.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "ニュース $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push

      - name: メールを送信
        if: steps.digest.outputs.skip != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        # 定期実行のときは 7:00 まで待つ。手動実行のときは待たずにすぐ送る
        run: python send_mail.py ${{ github.event_name == 'schedule' && '--wait-until 07:00' || '' }}
