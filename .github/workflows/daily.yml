name: 毎朝のニュース配信

on:
  schedule:
    # GitHub の定期実行は数分〜数十分遅れることがあるため、
    # 6:30 (日本時間) に起動して準備し、7:00 ちょうどまで待ってから送信する
    - cron: "30 21 * * *"
  workflow_dispatch: # 手動実行ボタン（テスト用）

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: ニュースを集めて選ぶ
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python digest.py

      - name: Web ページを更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "ニュース $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push

      - name: メールを送信
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        # 手動実行のときは待たずにすぐ送る
        run: python send_mail.py ${{ github.event_name == 'schedule' && '--wait-until 07:00' || '' }}
