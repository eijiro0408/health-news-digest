name: 毎朝のニュース配信

on:
  schedule:
    # GitHub の定期実行は混雑すると数時間遅れることがあるため、
    # 4:00・5:00・6:00（日本時間）に予約を入れておき、最初に動いた回が準備して
    # 7:00 まで待ってから送信する。あとから動いた回は「配信済み」なので何もしない
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: # 手動実行ボタン（テスト用。押すとすぐ配信する）

permissions:
  contents: write

# 同時に2つ動かないよう、順番待ちにする
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # Proプランで AI を動かすための公式コマンド（claude）を入れる
      - run: npm install -g @anthropic-ai/claude-code

      - name: ニュースを集めて選ぶ
        id: digest
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python digest.py ${{ github.event_name == 'schedule' && '--once-per-day' || '' }}

      - name: Web ページを更新
        if: steps.digest.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "ニュース $(TZ=Asia/Tokyo date +%F)" || echo "変更なし"
          git push

      - name: メールを送信
        if: steps.digest.outputs.skip != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        # 定期実行のときは 7:00 まで待つ。手動実行のときは待たずにすぐ送る
        run: python send_mail.py ${{ github.event_name == 'schedule' && '--wait-until 07:00' || '' }}
